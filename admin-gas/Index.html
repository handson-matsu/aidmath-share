<!doctype html>
<html lang="ja"><head><base target="_top"><meta charset="UTF-8"><?!= include_('Styles'); ?></head>
<body><header><strong>AidMath-Share</strong><span>管理者用</span></header>
<div class="layout"><nav aria-label="管理メニュー"><button type="button" data-view="topics" aria-current="page">テーマ管理</button><button type="button" data-view="posts">作品管理</button><button type="button" data-view="comments">コメント管理</button><button type="button" data-view="requests">削除申請管理</button></nav>
<main id="topics"><div class="heading"><div><p class="eyebrow">ADMINISTRATION</p><h1>テーマ管理</h1></div><div class="actions"><button id="reload" class="secondary">再読み込み</button><button id="new-topic">テーマを追加</button></div></div>
<p>テーマの追加・編集と公開状態を管理します。データの削除は行いません。</p>
<p class="hint">変更は生徒用ページの再読み込み後に反映されます。「非公開」はテーマ一覧からの非表示です。既存作品そのものを非公開にする機能ではありません。</p>
<p id="message" role="status" aria-live="polite"></p><section id="list" aria-label="テーマ一覧" aria-busy="true"></section>
</main>
<main id="moderation" hidden>
<div class="heading"><div><p class="eyebrow">ADMINISTRATION</p><h1 id="moderation-title"></h1></div><button id="moderation-reload" class="secondary">再読み込み</button></div>
<p id="moderation-hint" class="hint"></p>
<label id="request-filter-label" for="request-filter" hidden>申請の表示</label><select id="request-filter" hidden><option value="pending">未処理（pending）</option><option value="all">すべて</option></select>
<div id="comment-controls" hidden>
<div class="actions"><label>コメント状態<select id="comment-filter"><option value="all">すべて</option><option value="published">公開</option><option value="hidden">非公開</option><option value="deleted">削除済み</option></select></label>
<label>親作品状態<select id="comment-post-filter"><option value="all">すべて</option><option value="published">公開中</option><option value="hidden">非公開</option><option value="deleted">削除済み</option><option value="unknown">作品不明</option></select></label></div>
<div class="actions"><button id="comment-prev" class="secondary">前の50件</button><span id="comment-page" role="status"></span><button id="comment-next" class="secondary">次の50件</button></div>
</div>
<p id="moderation-message" role="status" aria-live="polite"></p><section id="moderation-list" aria-label="管理一覧" aria-busy="false"></section>
</main></div>
<dialog id="editor" aria-labelledby="editor-title"><form id="topic-form"><h2 id="editor-title">テーマを追加</h2>
<label for="topic-id">テーマID</label><input id="topic-id" required maxlength="80" autocomplete="off"><p class="hint">半角小文字英字で始まる英数字・ハイフン・アンダースコア。作成後は変更できません。</p>
<label for="topic-title">テーマ名</label><input id="topic-title" required maxlength="100">
<label for="topic-description">説明</label><textarea id="topic-description" rows="5" maxlength="3000"></textarea>
<p id="flags" class="hint"></p><label class="check"><input id="topic-active" type="checkbox">テーマ一覧に公開する</label><p id="new-hint" class="hint">新しいテーマは非公開で追加します。追加後に編集画面から公開してください。</p>
<p id="form-message" role="alert"></p><div class="actions"><button id="cancel" type="button" class="secondary">キャンセル</button><button id="save" type="submit">保存</button></div>
</form></dialog>
<?!= include_('App'); ?>
</body></html>
